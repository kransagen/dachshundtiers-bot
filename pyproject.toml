# Lokální i CI konfigurace nástrojů (ruff). Projekt nemá balíčkový build –
# sekce slouží jen nástrojům, ne instalaci.
#
# select = E4,E7,E9,F (pyflakes + parciální pycodestyle), protože ruff 0.16+
# mění VÝCHOZÍ sadu pravidel mezi verzemi. Explicitní select drží CI
# deterministické. E501 (délka řádku) se záměrně nepoužívá – kód má řádky
# až 131 znaků (embed zprávy) a line-length je čistě kosmetika.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "panel", "storage", "utils", "views", "config", "github_sync", "main"]
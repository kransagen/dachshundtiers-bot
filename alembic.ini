[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally NOT stored here (never commit credentials).
# migrations/env.py resolves it from the environment (DATABASE_URL / DB_*)
# or from --x migration flags. Set it only for one-off CLI runs:
#   alembic -x url='postgresql://...' upgrade head
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S